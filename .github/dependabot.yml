# Check GitHub Actions and the Python tool packages (tools/requirements.txt) monthly,
# opening update PRs while keeping maintenance noise low.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "monthly"
    labels:
      - "python"
